databaseChangeLog:
  - changeSet:
      id: usu-change-0.1.3-131-1
      comment: Afegir columnes per al seguiment de la darrera sessió de l'usuari
      author: limit
      changes:
        - addColumn:
            tableName: ${db_prefix}usuari
            columns:
              - column:
                  name: inici_darrer_periode
                  type: TIMESTAMP
              - column:
                  name: fi_darrer_periode
                  type: TIMESTAMP
              - column:
                  name: inici_periode_actual
                  type: TIMESTAMP
              - column:
                  name: darrera_activitat
                  type: TIMESTAMP
