databaseChangeLog:
  - changeSet:
      id: con-change-0.1.3-133-1
      author: limit
      comment: Afegir les columnes 'parametre_auth', 'nom_usuari_auth' i 'contrasenya_auth' a l'entorn aplicació per definir l'usuari d'autenticació
      changes:
        - addColumn:
            tableName: ${db_prefix}entorn_app
            columns:
              - column:
                  name: parametre_auth
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: nom_usuari_auth
                  type: VARCHAR(255 ${varcharUnit})
              - column:
                  name: contrasenya_auth
                  type: VARCHAR(255 ${varcharUnit})